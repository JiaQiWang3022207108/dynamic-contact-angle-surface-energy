<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于前进动态接触角的 OWRK 表面能计算器" />
    <title>表面能计算器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator">
      <header class="brand"><span class="brand-mark">γ</span><span>surface.energy</span></header>

      <section class="intro">
        <p class="eyebrow">OWRK / 前进动态接触角</p>
        <h1>表面能计算器</h1>
        <p>填写两种测试液的前进动态接触角，计算样品表面能及其色散、极性分量。</p>
      </section>

      <form id="calculatorForm" class="card input-card" novalidate>
        <div class="section-title">
          <div><p class="step">输入数据</p><h2>前进动态接触角</h2></div>
          <span>单位：°</span>
        </div>

        <div class="angle-fields">
          <label class="angle-field" for="waterAngle">
            <span class="liquid-name">去离子水</span>
            <small>γ<sub>L</sub> 72.8 · γ<sub>L</sub><sup>d</sup> 21.8 · γ<sub>L</sub><sup>p</sup> 51.0 mN/m</small>
            <input id="waterAngle" inputmode="decimal" type="number" min="0" max="180" step="0.01" placeholder="请输入前进角" aria-describedby="waterHint" />
            <em id="waterHint">前进动态接触角 θ<sub>A</sub></em>
          </label>
          <label class="angle-field" for="glycolAngle">
            <span class="liquid-name">乙二醇</span>
            <small>γ<sub>L</sub> 48.0 · γ<sub>L</sub><sup>d</sup> 29.0 · γ<sub>L</sub><sup>p</sup> 19.0 mN/m</small>
            <input id="glycolAngle" inputmode="decimal" type="number" min="0" max="180" step="0.01" placeholder="请输入前进角" aria-describedby="glycolHint" />
            <em id="glycolHint">前进动态接触角 θ<sub>A</sub></em>
          </label>
        </div>

        <button class="calculate-button" type="submit">计算表面能 <span>→</span></button>
        <p class="error" id="errorMessage" role="alert"></p>
      </form>

      <section class="card results" aria-live="polite" aria-labelledby="resultsTitle">
        <div class="section-title">
          <div><p class="step">计算结果</p><h2 id="resultsTitle">样品表面能</h2></div>
          <span class="status" id="fitStatus">待计算</span>
        </div>
        <div class="metric-grid">
          <article class="metric total"><span>总表面能 γ<sub>S</sub></span><strong id="totalEnergy">—</strong><small>mN/m</small></article>
          <article class="metric"><span>色散分量 γ<sub>S</sub><sup>d</sup></span><strong id="dispersiveEnergy">—</strong><small>mN/m</small></article>
          <article class="metric"><span>极性分量 γ<sub>S</sub><sup>p</sup></span><strong id="polarEnergy">—</strong><small>mN/m</small></article>
        </div>
      </section>

      <p class="footnote">按 OWRK 两组分模型计算；固定液体参数请按实际测试温度与文献来源核对。</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
